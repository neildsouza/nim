<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Journey to Canada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #f1c40f;
            text-align: center;
        }

        p.subtitle {
            margin-bottom: 25px;
            color: #bdc3c7;
            text-align: center;
        }

        /* Video Player Frame - Adjusted to ~16:9 widescreen ratio per panel */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            aspect-ratio: 16 / 9;
            background-color: #0f3460;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid #e94560;
        }

        /* Storyboard Frame Display */
        .frame-viewer {
            width: 100%;
            height: 100%;
            /* 3 columns = 300% width, 4 rows = 400% height */
            background-size: 300% 400%; 
            background-repeat: no-repeat;
            transition: background-position 0.2s ease-in-out;
        }

        /* Overlay Text / Caption */
        .caption-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            font-size: 1.05rem;
            text-align: center;
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* Controls Area */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        .progress-bar {
            margin-top: 15px;
            width: 100%;
            max-width: 750px;
            height: 8px;
            background-color: #16213e;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #f1c40f;
            transition: width 0.3s linear;
        }
    </style>
</head>
<body>

    <h1>The Parcel's Journey</h1>
    <p class="subtitle">An animated story from India to Canada</p>

    <div class="stage-container">
        <div id="viewer" class="frame-viewer"></div>
        <div id="caption" class="caption-bar">Loading story...</div>
    </div>

    <div class="progress-bar">
        <div id="progress" class="progress-fill"></div>
    </div>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">Pause</button>
        <button onclick="restart()">Restart</button>
    </div>

    <script>
        const scenes = [
            { col: 0, row: 0, text: "1. The Paw Patrol Rocky Recycle Truck is ready to be gifted." },
            { col: 1, row: 0, text: "2. Packing the toy carefully into the shipping box with my dog watching." },
            { col: 2, row: 0, text: "3. Writing the delivery details on the box." },
            { col: 0, row: 1, text: "4. Addressing to ATREUS DSOUZA in MILTON, CANADA." },
            { col: 1, row: 1, text: "5. Handing the package over at the local Indian Post Office." },
            { col: 2, row: 1, text: "6. Clear label added for international shipping to Canada." },
            { col: 0, row: 2, text: "7. The parcel is loaded onto the postal transport truck." },
            { col: 1, row: 2, text: "8. The mail truck starts its journey towards Goa, India." },
            { col: 2, row: 2, text: "9. Driving along the scenic coastal highway of Goa." },
            { col: 0, row: 3, text: "10. Approaching the sea port in Goa." },
            { col: 1, row: 3, text: "11. Unloading the postal packages at the ocean port." },
            { col: 2, row: 3, text: "12. Loaded onto the cargo ship, setting sail for Canada!" }
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let intervalId = null;

        const viewer = document.getElementById('viewer');
        const caption = document.getElementById('caption');
        const progress = document.getElementById('progress');
        const playBtn = document.getElementById('playBtn');

        // Points to storyboard.jpg in the same directory
        viewer.style.backgroundImage = "url('storyboard.jpg')";

        function updateScene() {
            const scene = scenes[currentIndex];
            
            // Percentage offset for grid positioning across 3 columns and 4 rows
            const xPercent = (scene.col / 2) * 100;
            const yPercent = (scene.row / 3) * 100;
            
            viewer.style.backgroundPosition = `${xPercent}% ${yPercent}%`;
            caption.innerText = scene.text;
            
            const progressPercent = ((currentIndex + 1) / scenes.length) * 100;
            progress.style.width = `${progressPercent}%`;
        }

        function nextFrame() {
            currentIndex = (currentIndex + 1) % scenes.length;
            updateScene();
        }

        function startAnimation() {
            intervalId = setInterval(nextFrame, 2200);
        }

        function togglePlay() {
            if (isPlaying) {
                clearInterval(intervalId);
                playBtn.innerText = "Play";
            } else {
                startAnimation();
                playBtn.innerText = "Pause";
            }
            isPlaying = !isPlaying;
        }

        function restart() {
            currentIndex = 0;
            updateScene();
            if (!isPlaying) {
                togglePlay();
            }
        }

        updateScene();
        startAnimation();
    </script>
</body>
</html>
